<div class="dashboard-layout">
  <!-- Sidebar -->
  <aside class="sidebar" [class.open]="sidebarOpen">
    <div class="sidebar-brand">
      <span class="brand">Elite<span class="accent">Events</span></span>
      <button class="close-btn d-lg-none" (click)="sidebarOpen = false">
        <span class="material-icons">close</span>
      </button>
    </div>
    <nav class="sidebar-nav">
      <a routerLink="/customer" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
        <span class="material-icons">dashboard</span> Dashboard
      </a>
      <a routerLink="/customer/bookings" routerLinkActive="active" class="nav-item">
        <span class="material-icons">book_online</span> My Bookings
      </a>
      <a routerLink="/customer/payments" routerLinkActive="active" class="nav-item">
        <span class="material-icons">payment</span> Payments
      </a>
      <a routerLink="/customer/notifications" routerLinkActive="active" class="nav-item">
        <span class="material-icons">notifications</span> Notifications
      </a>
      <a routerLink="/customer/reviews" routerLinkActive="active" class="nav-item">
        <span class="material-icons">rate_review</span> My Reviews
      </a>
      <a routerLink="/customer/profile" routerLinkActive="active" class="nav-item">
        <span class="material-icons">person</span> Profile
      </a>
      <a routerLink="/customer/settings" routerLinkActive="active" class="nav-item">
        <span class="material-icons">settings</span> Settings
      </a>
      <a routerLink="/customer/employee-registration" routerLinkActive="active" class="nav-item">
        <span class="material-icons">person_add</span> Employee Details
      </a>
    </nav>
    <div class="sidebar-footer">
      <a routerLink="/" class="nav-item"><span class="material-icons">home</span> Back to Site</a>
      <a class="nav-item" (click)="logout()"><span class="material-icons">logout</span> Logout</a>
    </div>
  </aside>

  <!-- Overlay for mobile -->
  @if (sidebarOpen) {
    <div class="sidebar-overlay d-lg-none" (click)="sidebarOpen = false"></div>
  }

  <!-- Main Content -->
  <main class="main-content">
    <header class="top-bar">
      <div class="d-flex align-items-center gap-3">
        <button class="menu-btn d-lg-none" (click)="sidebarOpen = !sidebarOpen">
          <span class="material-icons">menu</span>
        </button>
        <h2>{{ pageTitle }}</h2>
      </div>
      <div class="top-actions">
        <button class="icon-btn" routerLink="/customer/notifications">
          <span class="material-icons">notifications</span>
          @if (unreadCount() > 0) { <span class="badge-count">{{ unreadCount() }}</span> }
        </button>
        <div class="user-avatar">{{ user()?.fullName?.charAt(0) || 'U' }}</div>
      </div>
    </header>

    <div class="content-area">
      <router-outlet />
    </div>
  </main>
</div>
