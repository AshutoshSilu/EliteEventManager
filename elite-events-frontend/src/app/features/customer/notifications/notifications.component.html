<div class="page-content">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Notifications</h2>
    @if (notifications().length) {
      <button class="btn btn-outline-custom btn-sm" (click)="markAllRead()">Mark All Read</button>
    }
  </div>
  @for (n of notifications(); track n.id) {
    <div class="notification-item" [class.unread]="!n.isRead" (click)="markRead(n)">
      <span class="material-icons notif-icon" [class]="'type-' + n.type.toLowerCase()">
        {{ getIcon(n.type) }}
      </span>
      <div class="notif-content">
        <h5>{{ n.title }}</h5>
        <p>{{ n.message }}</p>
        <span class="notif-time">{{ n.createdAt | date:'medium' }}</span>
      </div>
    </div>
  } @empty {
    <div class="empty-state"><span class="material-icons">notifications_off</span><p>No notifications</p></div>
  }
</div>
